"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# .env is gitignored, so Conductor copies it from the root checkout into each
# new workspace. All workspaces therefore share the same local Postgres.
file_include_globs = """
.env
"""

[scripts]
setup = "bun install"
run_mode = "concurrent"

[scripts.run.dev]
command = "bun dev --port $CONDUCTOR_PORT"
default = true
icon = "play"
